<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man: Brand New Day | 3D Web & GSAP Scroll Experience</title>
    <meta name="description" content="A scroll-driven 3D WebGL web experience for Spider-Man: Brand New Day featuring 3D webs (Three.js), Peter & Gwen, GSAP ScrollTrigger, and Lenis smooth scroll.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@700;900&family=Montserrat:wght@400;700;900&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Lenis Smooth Scroll CSS -->
    <link rel="stylesheet" href="https://unpkg.com/lenis@1.1.9/dist/lenis.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Three.js 3D Web Background Viewport Container -->
    <div id="web-3d-container"></div>

    <!-- Custom Spider Cursor -->
    <div class="spider-cursor" id="spider-cursor"></div>

    <!-- Main Scroll Container -->
    <main id="smooth-wrapper">

        <!-- SECTION 1: HERO LANDING (BRAND NEW DAY) -->
        <section class="hero-section" id="hero">
            <div class="hero-card-wrapper" id="hero-card">
                <!-- Poster Graphic Background -->
                <div class="poster-graphic">
                    <svg class="poster-svg-art" viewBox="0 0 1000 600">
                        <defs>
                            <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#14283b"/>
                                <stop offset="50%" stop-color="#3b1c2b"/>
                                <stop offset="100%" stop-color="#0f1923"/>
                            </linearGradient>
                            <linearGradient id="webGrad" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.3"/>
                                <stop offset="100%" stop-color="#FF2E4D" stop-opacity="0.3"/>
                            </linearGradient>
                        </defs>
                        <rect width="1000" height="600" fill="url(#bgGrad)"/>
                        <!-- Comic Grid Overlay -->
                        <g opacity="0.15">
                            <line x1="100" y1="0" x2="100" y2="600" stroke="#FFF" stroke-width="2"/>
                            <line x1="300" y1="0" x2="300" y2="600" stroke="#FFF" stroke-width="2"/>
                            <line x1="700" y1="0" x2="700" y2="600" stroke="#FFF" stroke-width="2"/>
                            <line x1="900" y1="0" x2="900" y2="600" stroke="#FFF" stroke-width="2"/>
                        </g>
                        <!-- Spider Web Graphic -->
                        <path d="M500,0 L500,600 M0,300 L1000,300 M100,0 L900,600 M100,600 L900,0" stroke="url(#webGrad)" stroke-width="3"/>
                        <circle cx="500" cy="300" r="100" fill="none" stroke="url(#webGrad)" stroke-width="2"/>
                        <circle cx="500" cy="300" r="200" fill="none" stroke="url(#webGrad)" stroke-width="2"/>
                    </svg>
                </div>

                <!-- 3D Title Overlay -->
                <div class="hero-title-container">
                    <span class="hero-subtext">Spider-Man</span>
                    <h1 class="hero-main-title">SPIDER-MAN</h1>
                    <div class="hero-gold-text">BRAND NEW DAY</div>
                </div>
            </div>
        </section>

        <!-- SECTION 2: NEEDLESS & LANDING PAGE -->
        <section class="section-lyric section-needless" id="section-needless">
            <div class="bg-watermark">NEEDLESS</div>
            <div class="lyric-content">
                <h2 class="lyric-title">Landing Page</h2>
                <p class="lyric-sub">TO SAY, I KEEP IN CHECK</p>
            </div>
        </section>

        <!-- SECTION 3: SHE WAS A BAD... -->
        <section class="section-lyric section-badthang" id="section-badthang">
            <div class="badthang-container">
                <h2 class="giant-lyric-text" id="badthang-text">SHE WAS A BAD...</h2>
                <div class="hero-poster-expand" id="poster-expand">
                    <div class="poster-inner-graphic">
                        <div class="spider-face-illustration">
                            <svg viewBox="0 0 400 400" class="hero-face-svg">
                                <circle cx="200" cy="200" r="150" fill="#E50914"/>
                                <path d="M120,160 Q170,120 200,190 Q170,260 120,160 Z" fill="#FFF" stroke="#000" stroke-width="8"/>
                                <path d="M280,160 Q230,120 200,190 Q230,260 280,160 Z" fill="#FFF" stroke="#000" stroke-width="8"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECTION 4: BABY, I'M A... WITH INSET CARDS -->
        <section class="section-lyric section-baby-wrecks" id="section-cards">
            <div class="cards-layout">
                <!-- Left Inset Card -->
                <div class="inset-card card-left">
                    <div class="card-img-wrapper crowd-img">
                        <div class="card-label">NEW YORK CITY</div>
                    </div>
                </div>

                <!-- Center Kinetic Text -->
                <div class="center-lyric">
                    <h2 class="lyric-bold-text">BABY, I'M A...</h2>
                </div>

                <!-- Right Inset Card (Gwen Walkie Talkie) -->
                <div class="inset-card card-right">
                    <div class="card-img-wrapper gwen-img">
                        <div class="card-frame-border"></div>
                        <div class="card-label">GWEN STACY</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECTION 5: PETER AND GWEN Encounter ("BABY, YOU'RE A WRECK") -->
        <section class="section-lyric section-peter-gwen" id="section-encounter">
            <div class="encounter-header">Peter and Gwen</div>

            <div class="encounter-container">
                <!-- Left Side: Spider-Man Profile -->
                <div class="profile-side profile-spidey">
                    <div class="spidey-head-art">
                        <svg viewBox="0 0 300 400" class="profile-svg">
                            <path d="M50,100 C50,20 Q250,20 250,100 C250,250 180,350 150,380 C120,350 50,250 50,100 Z" fill="#E50914" stroke="#000" stroke-width="4"/>
                            <!-- Eye -->
                            <path d="M120,130 Q190,90 220,160 Q170,220 120,130 Z" fill="#FFF" stroke="#000" stroke-width="6"/>
                            <!-- Web Lines -->
                            <line x1="150" y1="20" x2="150" y2="380" stroke="#000" stroke-width="2"/>
                            <line x1="50" y1="100" x2="250" y2="100" stroke="#000" stroke-width="2"/>
                            <line x1="70" y1="200" x2="230" y2="200" stroke="#000" stroke-width="2"/>
                        </svg>
                    </div>
                </div>

                <!-- Center Hanging Web & Kinetic Text -->
                <div class="center-web-container">
                    <div class="hanging-web-line"></div>
                    <div class="hanging-spider">🕷️</div>
                    <h2 class="encounter-lyric">BABY, YOU'RE A WRECK</h2>
                </div>

                <!-- Right Side: Gwen Stacy Profile -->
                <div class="profile-side profile-gwen">
                    <div class="gwen-head-art">
                        <svg viewBox="0 0 300 400" class="profile-svg">
                            <path d="M50,80 C50,10 250,10 250,80 C250,220 200,340 150,370 C100,340 50,220 50,80 Z" fill="#FFC857" stroke="#000" stroke-width="4"/>
                            <!-- Face Contour -->
                            <path d="M90,120 C90,80 210,80 210,120 C210,240 150,300 150,300 Z" fill="#FFE0BD"/>
                            <!-- Eyes & Hair -->
                            <circle cx="120" cy="150" r="12" fill="#2B2D42"/>
                            <circle cx="180" cy="150" r="12" fill="#2B2D42"/>
                            <!-- Headband -->
                            <path d="M80,90 Q150,60 220,90" stroke="#2B2D42" stroke-width="12" fill="none"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Bottom Floating Badges Grid -->
            <div class="badges-row">
                <div class="badge-item">
                    <div class="badge-icon">🕸️</div>
                    <span>SPIDER-GWEN</span>
                </div>
                <div class="badge-item active">
                    <div class="badge-icon">🕷️</div>
                    <span>SPIDER-MAN</span>
                </div>
                <div class="badge-item">
                    <div class="badge-icon">⚡</div>
                    <span>MILES MORALES</span>
                </div>
            </div>
        </section>

    </main>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- GSAP & Lenis Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/lenis@1.1.9/dist/lenis.min.js"></script>

    <!-- Custom Scripts -->
    <script src="web3d.js"></script>
    <script src="app.js"></script>
</body>
</html>
